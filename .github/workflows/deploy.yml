name: Deploy to Sakura Internet

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: 'デプロイメモ（任意）'
        required: false
        default: '手動デプロイ'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP (lftp)
        run: |
          sudo apt-get install -y lftp
          REMOTE_DIR="/home/niconicoyasai/www/hanoi-order.niconicoyasai.jp"
          HOST="${{ secrets.SAKURA_FTP_HOST }}"
          USER="${{ secrets.SAKURA_FTP_USER }}"
          PASS="${{ secrets.SAKURA_FTP_PASS }}"

          lftp -u "$USER,$PASS" ftp://"$HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          mirror -R --no-perms --ignore-time \
            --exclude=^\.git/ \
            --exclude=^\.github/ \
            --exclude=^\.gitignore$ \
            . $REMOTE_DIR
          quit
          EOF
