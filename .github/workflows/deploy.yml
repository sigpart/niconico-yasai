name: Deploy to Sakura Internet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SAKURA_FTP_HOST }}
          username: ${{ secrets.SAKURA_FTP_USER }}
          password: ${{ secrets.SAKURA_FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /home/niconicoyasai/www/hanoi-order.niconicoyasai.jp/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            *.md
