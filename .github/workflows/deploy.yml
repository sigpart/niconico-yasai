name: Deploy to Sakura Internet

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: 'デプロイメモ（任意）'
        required: false
        default: '手動デプロイ'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        env:
          SSHPASS: ${{ secrets.SAKURA_FTP_PASS }}
        run: |
          sudo apt-get install -y sshpass rsync
          REMOTE_DIR="/home/niconicoyasai/www/hanoi-order.niconicoyasai.jp"
          HOST="${{ secrets.SAKURA_FTP_HOST }}"
          USER="${{ secrets.SAKURA_FTP_USER }}"

          sshpass -e rsync -avz --no-perms --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            -e "ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR" \
            ./ "$USER@$HOST:$REMOTE_DIR/"
