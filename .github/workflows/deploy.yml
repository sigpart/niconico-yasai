name: Deploy to Sakura Internet

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: 'デプロイメモ（任意）'
        required: false
        default: '手動デプロイ'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SAKURA_FTP_HOST }}
          username: ${{ secrets.SAKURA_FTP_USER }}
          password: ${{ secrets.SAKURA_FTP_PASS }}
          port: 22
          local_path: './*'
          remote_path: '/home/niconicoyasai/www/hanoi-order.niconicoyasai.jp'
          sftp_only: true
          args: '-o StrictHostKeyChecking=no'
