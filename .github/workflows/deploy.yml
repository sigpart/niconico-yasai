name: Deploy to Sakura Internet

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: 'デプロイメモ（任意）'
        required: false
        default: '手動デプロイ'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP (lftp)
        run: |
          sudo apt-get install -y lftp
          REMOTE_DIR="/home/niconicoyasai/www"
          FTP_HOST="${{ secrets.SAKURA_FTP_HOST }}"
          FTP_USER="${{ secrets.SAKURA_FTP_USER }}"
          FTP_PASS="${{ secrets.SAKURA_FTP_PASS }}"

          lftp -d -u "$FTP_USER,$FTP_PASS" ftp://"$FTP_HOST" -e "
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 30;
            mirror -R --verbose --no-perms --ignore-time --transfer-all --exclude=^\.git/ --exclude=^\.github/ --exclude=^\.gitignore$ . $REMOTE_DIR;
            quit
          "
