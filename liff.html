<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINE認証 | NICO NICO YASAI</title>
<style>
body{font-family:'Noto Sans JP',sans-serif;background:#e6f4e8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
.card{background:#fff;border-radius:16px;padding:32px 24px;text-align:center;box-shadow:0 4px 24px rgba(26,107,42,.12);max-width:320px;width:90%;}
.ico{font-size:52px;margin-bottom:12px;}
h2{color:#1a6b2a;margin:0 0 8px;font-size:18px;}
p{color:#5a7060;font-size:13px;margin:0;line-height:1.6;}
</style>
</head>
<body>
<div class="card">
  <div class="ico" id="ico">⏳</div>
  <h2 id="ttl">LINE認証中...</h2>
  <p id="msg">しばらくお待ちください</p>
</div>
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<script>
var LIFF_ID="2012327298-k4OuH8dt";
liff.init({liffId:LIFF_ID}).then(function(){
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
  var idToken=liff.getDecodedIDToken();
  var userId=idToken&&idToken.sub;
  if(!userId){throw new Error("User ID取得失敗");}
  try{localStorage.setItem("nny_line_uid",userId);}catch(e){}
  document.getElementById("ico").textContent="✅";
  document.getElementById("ttl").textContent="LINE認証完了！";
  document.getElementById("msg").textContent="注文画面に戻ってください";
  if(liff.isInClient()){setTimeout(function(){liff.closeWindow();},1500);}
}).catch(function(e){
  document.getElementById("ico").textContent="❌";
  document.getElementById("ttl").textContent="エラーが発生しました";
  document.getElementById("msg").textContent=e&&e.message?e.message:"もう一度お試しください";
});
</script>
</body>
</html>
